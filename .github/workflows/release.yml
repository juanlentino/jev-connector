name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    name: Build distributable zip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Stage plugin files
        run: |
          SLUG=connector-for-typesafe-jev
          mkdir -p build/$SLUG
          rsync -a --exclude-from=.distignore ./ build/$SLUG/
          cd build && zip -rq $SLUG.zip $SLUG

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: connector-for-typesafe-jev
          path: build/connector-for-typesafe-jev.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: build/connector-for-typesafe-jev.zip
          generate_release_notes: true
